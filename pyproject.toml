[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daemon"
version = "0.1.0"
description = "Lokalny, multimodalny asystent AI sterowany głosem — serwer LXC"
requires-python = ">=3.11"
dependencies = [
    # backend
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "jinja2>=3.1.0",
    # konfiguracja
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    # LLM (klient Ollama przez OpenAI-compat API)
    "httpx>=0.27.0",
    "openai>=1.14.0",
    # TTS: Piper ONNX CPU (ZAKAZ: torch+cuda, Coqui TTS)
    "piper-tts>=1.2.0",
    "onnxruntime>=1.17.0",
    "numpy>=1.26",
    "soundfile>=0.12",
    # system helpers
    "psutil>=5.9",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "api*"]

[tool.isort]
profile = "black"
line_length = 88

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = [
  "."
]
testpaths = [
  "tests"
]
addopts = "--strict-config --strict-markers --cov=app --cov-report=term-missing --cov-fail-under=60"

